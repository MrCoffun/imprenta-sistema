name: Integracion continua y despliegue en Azure

on:
  push:
    branches:
      - migracion-mongodb
  pull_request:
    branches:
      - migracion-mongodb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imprenta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integracion-continua:
    name: Integracion continua (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis del codigo
        run: npm run check

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Auditar vulnerabilidades
        run: npm run audit

  publicar:
    name: Despliegue continuo (CD)
    needs: integracion-continua

    if: github.ref == 'refs/heads/migracion-mongodb' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Obtener el codigo validado
        uses: actions/checkout@v4

      - name: Preparar archivos de publicacion
        run: git archive --format=zip -o "$RUNNER_TEMP/imprenta.zip" HEAD

      - name: Conectar con Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: imprenta-sistema-ot
          package: ${{ runner.temp }}/imprenta.zip